id: io.github.shaykadosh.CodeEditor
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: gtk-code-editor
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
modules:
  - name: gtk-code-editor
    buildsystem: simple
    build-commands:
      - install -Dm755 target/release/gtk-code-editor /app/bin/gtk-code-editor
      - install -Dm644 assets/fonts/*.ttf -t /app/share/fonts/
      - install -Dm644 io.github.shaykadosh.CodeEditor.desktop /app/share/applications/io.github.shaykadosh.CodeEditor.desktop
      - install -Dm644 io.github.shaykadosh.CodeEditor.svg /app/share/icons/hicolor/scalable/apps/io.github.shaykadosh.CodeEditor.svg
    sources:
      - type: dir
        path: .
        skip:
          - target/debug
          - target/release/deps
          - target/release/build
          - target/release/incremental
          - build-dir
          - repo
          - .flatpak-builder
          - "*.flatpak"
